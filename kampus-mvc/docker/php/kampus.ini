; Pengaturan PHP untuk pengembangan
display_errors = On
error_reporting = E_ALL
date.timezone = Asia/Jakarta

; Xdebug: aktif hanya jika dipicu (ikon telepon "Start Listening" di PhpStorm
; + ekstensi browser Xdebug Helper, atau tambahkan ?XDEBUG_TRIGGER=1 di URL)
xdebug.mode = debug
xdebug.start_with_request = trigger
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
