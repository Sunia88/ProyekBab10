# docker-compose.yml - 3 service: web (PHP+Apache), db (MySQL), phpmyadmin
services:
  web:
    build: .
    container_name: kampus-web
    ports:
      - "8000:80"                 # http://localhost:8000
    volumes:
      - ./:/var/www/html          # kode di laptop langsung terbaca container
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: db_kampus
      DB_USERNAME: app_kampus
      DB_PASSWORD: rahasia123
      PHP_IDE_CONFIG: "serverName=kampus-docker"   # untuk Xdebug PhpStorm
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: kampus-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_kampus
      MYSQL_USER: app_kampus
      MYSQL_PASSWORD: rahasia123
      TZ: Asia/Jakarta
    ports:
      - "3307:3306"               # 3307 agar tidak bentrok dgn MySQL lokal
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:5
    container_name: kampus-pma
    ports:
      - "8080:80"                 # http://localhost:8080
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - db

volumes:
  dbdata:
